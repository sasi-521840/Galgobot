<div class="pcoded-main-container">

			<div class="table-responsive text-nowrap">
        <!-- [ Main Content ] start -->
        <div class="row">
            <!-- table card-1 start -->
           
		

			<div class="col-12">
				<canvas id="barChart" width="7" height="2" ></canvas>
				  </div>
			  
	
			  <script>
				const ctx = document.getElementById("barChart").getContext("2d");
				const myChart = new Chart(ctx, {
				  type: "bar",
				  data: {
					labels: ["verypositive","positive",  "neutral","verynegitive","negitive"],
					datasets: [
					  {
						label: "Reviews",
						data: ["{{verypositive}}", "{{positive}}", "{{neutral}}","{{verynegitive}}","{{negitive}}"],
	
						backgroundColor: [
						'rgba(255, 99, 132, 0.2)',
						'rgba(54, 162, 235, 0.2)',
						'rgba(255, 206, 86, 0.2)',
						'rgba(75, 192, 192, 0.2)',
						'rgba(153, 102, 255, 0.2)',
						'rgba(255, 159, 64, 0.2)'
						 ],
							borderColor: [
							  'rgba(255,99,132,1)',
							  'rgba(54, 162, 235, 1)',
							  'rgba(255, 206, 86, 1)',
							  'rgba(75, 192, 192, 1)',
							  'rgba(153, 102, 255, 1)',
							  'rgba(255, 159, 64, 1)'
						  ],
						borderWidth: 1,
						hoverBorderColor: ["green", "red", "yellow","orange","pink"],
					  },
					],
				  },
				  options: {
					legend: {
					  labels: {
						fontColor: "blue",
						fontSize: 18,
					  },
					},
					scales: {
					  y: {
						beginAtZero: true,
					  },
					},
				  },
				});
			  </script>


            


            </div>
            <!-- table card-1 end -->
           
        </div>
